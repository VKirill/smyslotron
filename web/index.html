<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Семантика — проекты кластеризации</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap">
<style>
  :root{
    --bg:#0f1115; --panel:#161a22; --panel2:#1c2130; --border:#262c3d;
    --text:#dde3ee; --muted:#8b93a7; --accent:#5b8cff; --accent2:#38c793;
    --warn:#e5a93d; --err:#e05d5d; --hl:#2a3350;
  }
  *{box-sizing:border-box; margin:0}
  body{background:var(--bg); color:var(--text); min-height:100vh;
    font:15px/1.5 "Inter","Segoe UI",-apple-system,Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased}
  header{padding:12px 20px; border-bottom:1px solid var(--border); display:flex;
    align-items:baseline; gap:14px}
  header h1{font-size:17px; font-weight:600}
  header .sub{color:var(--muted); font-size:12.5px}
  header .who{margin-left:auto; color:var(--muted); font-size:13px; display:flex; gap:12px}
  main{max-width:860px; margin:0 auto; padding:28px 20px}
  button{font:inherit}
  .btn{background:var(--accent); color:#fff; border:0; border-radius:9px;
    padding:9px 18px; cursor:pointer; font-size:14.5px; text-decoration:none; display:inline-block}
  .btn:hover{filter:brightness(1.1)}
  .btn.sec{background:var(--panel2); color:var(--text); border:1px solid var(--border)}
  .btn.sec:hover{border-color:var(--accent)}
  .link{background:none; border:0; color:var(--accent); cursor:pointer; padding:0; font-size:13px}
  .link:hover{text-decoration:underline}
  input,select{font:inherit; width:100%; padding:9px 12px; background:var(--panel2);
    border:1px solid var(--border); border-radius:9px; color:var(--text); outline:none}
  input:focus,select:focus{border-color:var(--accent)}
  .err{color:var(--err); font-size:13px; min-height:18px; margin-top:8px}
  .authbox{max-width:360px; margin:8vh auto; background:var(--panel);
    border:1px solid var(--border); border-radius:14px; padding:26px}
  .authbox .fld{margin-bottom:12px}
  .authbox .fld label{display:block; font-size:12.5px; color:var(--muted); margin-bottom:5px}
  .tabs{display:flex; gap:16px; margin-bottom:18px}
  .tabs button{background:none; border:0; color:var(--muted); font-size:15px;
    cursor:pointer; padding:0 0 6px; border-bottom:2px solid transparent}
  .tabs button.on{color:var(--text); border-color:var(--accent)}
  .drop{border:2px dashed var(--border); border-radius:14px; padding:26px;
    text-align:center; color:var(--muted); cursor:pointer; margin-bottom:22px}
  .drop:hover,.drop.over{border-color:var(--accent); color:var(--text)}
  .card{background:var(--panel); border:1px solid var(--border); border-radius:12px;
    padding:14px 18px; margin-bottom:12px; display:flex; align-items:center; gap:14px;
    flex-wrap:wrap}
  .card .nm{font-weight:600; font-size:15px}
  .card .meta{color:var(--muted); font-size:12.5px}
  .card .grow{flex:1; min-width:200px}
  .st{font-size:12px; border-radius:20px; padding:2px 10px; border:1px solid var(--border); flex:none}
  .st.ready{color:var(--accent2); border-color:var(--accent2)}
  .st.running{color:var(--warn); border-color:var(--warn)}
  .st.queued{color:var(--muted)}
  .st.failed{color:var(--err); border-color:var(--err)}
  .bar{height:5px; background:var(--panel2); border-radius:3px; overflow:hidden;
    margin-top:8px; width:100%}
  .bar i{display:block; height:100%; background:var(--warn); transition:width .5s}
  .acts{display:flex; gap:8px; flex-wrap:wrap}
  .acts .btn{padding:6px 12px; font-size:13px}
  .empty{color:var(--muted); text-align:center; padding:30px 0}
  .modal{position:fixed; inset:0; background:rgba(10,12,16,.8); display:flex;
    align-items:center; justify-content:center; z-index:20; padding:16px}
  .mbox{background:var(--panel); border:1px solid var(--border); border-radius:14px;
    max-width:820px; width:100%; max-height:92vh; overflow-y:auto; padding:22px}
  .mbox h2{font-size:16px; margin-bottom:14px}
  .mrow{display:flex; gap:16px; flex-wrap:wrap; margin-bottom:14px; align-items:flex-end}
  .mrow .fld{flex:1; min-width:150px}
  .mrow .fld label{display:block; font-size:12px; color:var(--muted); margin-bottom:5px}
  .chk{display:flex; align-items:center; gap:8px; font-size:14px; padding:9px 0}
  .chk input{width:auto}
  .ptable{overflow-x:auto; border:1px solid var(--border); border-radius:10px; margin-bottom:14px}
  table{border-collapse:collapse; width:100%; font-size:12.5px}
  th{padding:6px; background:var(--panel2); border-bottom:1px solid var(--border)}
  th select{padding:5px 6px; font-size:12px; border-radius:6px; min-width:110px}
  td{padding:5px 9px; border-bottom:1px solid var(--panel2); white-space:nowrap;
    max-width:220px; overflow:hidden; text-overflow:ellipsis; color:var(--muted)}
  tr.hdr td{color:var(--warn)}
  .mfoot{display:flex; gap:10px; justify-content:flex-end; align-items:center}
  #loader{position:fixed; inset:0; background:rgba(15,17,21,.85); display:none;
    align-items:center; justify-content:center; z-index:30}
  .spin{width:26px; height:26px; border:3px solid var(--border);
    border-top-color:var(--accent); border-radius:50%; animation:r .8s linear infinite}
  @keyframes r{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<header>
  <h1>Семантика</h1>
  <nav style="display:flex; gap:14px">
    <a href="./" style="color:var(--text); text-decoration:none; font-size:14px; border-bottom:2px solid var(--accent); padding-bottom:2px">Проекты</a>
    <a href="merge.html" style="color:var(--muted); text-decoration:none; font-size:14px">Объединить CSV</a>
  </nav>
  <span class="who" id="who"></span>
</header>
<main id="main"></main>
<div id="loader"><div class="spin"></div></div>

<script>
"use strict";
const $ = s => document.querySelector(s);
const fmt = n => (+n || 0).toLocaleString("ru-RU");
const API = "api";
let ME = null, TIMER = null, APPEND_PID = null;

async function api(path, opts = {}){
  const r = await fetch(`${API}/${path}`, {credentials: "same-origin", ...opts});
  if (r.status === 401 && path !== "auth/me"){ renderAuth(); throw new Error("401"); }
  const data = r.headers.get("content-type")?.includes("json") ? await r.json() : null;
  if (!r.ok) throw new Error(data?.detail || `Ошибка ${r.status}`);
  return data;
}
function loading(on){ $("#loader").style.display = on ? "flex" : "none"; }
function esc(s){ return String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;"); }

/* ---------------- auth ---------------- */
function renderAuth(mode = "login"){
  clearInterval(TIMER);
  $("#who").innerHTML = "";
  $("#main").innerHTML = `
  <div class="authbox">
    <div class="tabs">
      <button id="tLogin" class="${mode === "login" ? "on" : ""}">Вход</button>
      <button id="tReg" class="${mode === "reg" ? "on" : ""}">Регистрация</button>
    </div>
    <div class="fld"><label>Почта</label><input id="aEmail" type="email" placeholder="you@mail.ru"></div>
    <div class="fld"><label>Пароль${mode === "reg" ? " (минимум 6 символов)" : ""}</label>
      <input id="aPw" type="password"></div>
    <button class="btn" id="aGo" style="width:100%">${mode === "login" ? "Войти" : "Создать аккаунт"}</button>
    <div class="err" id="aErr"></div>
  </div>`;
  $("#tLogin").onclick = () => renderAuth("login");
  $("#tReg").onclick = () => renderAuth("reg");
  const go = async () => {
    $("#aErr").textContent = "";
    try{
      ME = await api(mode === "login" ? "auth/login" : "auth/register", {
        method: "POST", headers: {"Content-Type": "application/json"},
        body: JSON.stringify({email: $("#aEmail").value, password: $("#aPw").value})});
      renderProjects();
    }catch(e){ $("#aErr").textContent = e.message; }
  };
  $("#aGo").onclick = go;
  $("#aPw").addEventListener("keydown", e => { if (e.key === "Enter") go(); });
}

/* ---------------- projects ---------------- */
const ST_NAME = {queued: "в очереди", running: "обработка", ready: "готов", failed: "ошибка"};

async function renderProjects(){
  $("#who").innerHTML = `${esc(ME.email)} · <button class="link" id="outBtn">выйти</button>`;
  $("#outBtn").onclick = async () => { await api("auth/logout", {method: "POST"}); ME = null; renderAuth(); };
  $("#main").innerHTML = `
    <div class="drop" id="drop">Перетащи сюда CSV/TXT с запросами<br>
      <span style="font-size:12.5px">или кликни, чтобы выбрать файл · до 100 000 фраз · Keys.so, Key Collector, Wordstat — колонки настроишь на следующем шаге</span>
      <input id="file" type="file" accept=".csv,.txt,.tsv" hidden></div>
    <div id="plist"></div>`;
  const drop = $("#drop"), file = $("#file");
  drop.onclick = () => file.click();
  drop.ondragover = e => { e.preventDefault(); drop.classList.add("over"); };
  drop.ondragleave = () => drop.classList.remove("over");
  drop.ondrop = e => { e.preventDefault(); drop.classList.remove("over");
    if (e.dataTransfer.files[0]) startUpload(e.dataTransfer.files[0]); };
  file.onchange = () => {
    const target = APPEND_PID; APPEND_PID = null;
    if (file.files[0]) startUpload(file.files[0], target);
    file.value = "";
  };
  await refreshList();
  clearInterval(TIMER);
  TIMER = setInterval(refreshList, 4000);
}

async function refreshList(){
  let list;
  try{ list = await api("projects"); }catch(e){ return; }
  const el = $("#plist");
  if (!el) return;
  if (!list.length){ el.innerHTML = `<div class="empty">Проектов пока нет — загрузи первый файл</div>`; return; }
  el.innerHTML = "";
  for (const pr of list){
    const card = document.createElement("div");
    card.className = "card";
    const pct = pr.progress?.pct ?? 0;
    const stage = pr.progress?.stage ?? "";
    card.innerHTML = `
      <div class="grow">
        <div class="nm">${esc(pr.name)}</div>
        <div class="meta" title="${(pr.variants || []).join(", ")}">${fmt(pr.rows)} фраз${pr.uniq ? ` · ${fmt(pr.uniq)} смыслов` : ""}${pr.clusters ? ` · ${fmt(pr.clusters)} кластеров` : ""}${pr.cost_rub ? ` · ${(+pr.cost_rub).toFixed(2)} ₽` : ""} · ${pr.created}</div>
        ${pr.history ? `<div class="meta">📈 пополнения: ${esc(pr.history)}</div>` : ""}
        ${pr.costs?.total_usd ? `<div class="meta">💰 эмбеддинги: OpenAI $${pr.costs.openai_usd} · Gemini $${pr.costs.gemini_usd}${pr.costs.voyage_usd ? ` · Voyage $${pr.costs.voyage_usd}` : ""}${pr.costs.qwen_usd ? ` · Qwen $${pr.costs.qwen_usd}` : ""}${pr.costs.deepseek_usd ? ` · LLM-разметка $${pr.costs.deepseek_usd}${pr.costs.per_cluster_usd ? ` ($${pr.costs.per_cluster_usd}/кластер)` : ""}` : ""} · <b>$${pr.costs.per_query_usd}/запрос</b></div>` : ""}
        ${pr.status === "running" ? `<div class="meta" style="color:var(--warn)">${esc(stage)}…</div><div class="bar"><i style="width:${pct}%"></i></div>` : ""}
        ${pr.status === "failed" ? `<div class="meta" style="color:var(--err)">${esc(pr.error || "")}</div>` : ""}
      </div>
      <span class="st ${pr.status}">${ST_NAME[pr.status] || pr.status}</span>
      <div class="acts">
        ${pr.status === "ready" ? `<a class="btn" href="view.html?p=${pr.id}">Открыть</a>
          <a class="btn sec" href="${API}/projects/${pr.id}/data/result.csv">CSV</a>
          ${!pr.labeled ? `<button class="btn sec" data-a="label" title="Разметить интенты кластеров через DeepSeek (~10 ₽ на 30К фраз)">Интенты (LLM)</button>` : ""}` : ""}
        ${pr.status === "failed" ? `<button class="btn sec" data-a="run">Повторить</button>` : ""}
        ${pr.status !== "running" && pr.status !== "queued" ? `<button class="btn sec" data-a="add" title="Докинуть фразы из файла: дубли схлопнутся, новое доэмбеддится инкрементально">➕ Фразы</button>` : ""}
        ${pr.status !== "running" ? `<button class="btn sec" data-a="del" title="Удалить">🗑</button>` : ""}
      </div>`;
    card.querySelectorAll("[data-a]").forEach(b => b.onclick = async () => {
      try{
        if (b.dataset.a === "del"){
          if (!confirm(`Удалить проект «${pr.name}»?`)) return;
          await api(`projects/${pr.id}`, {method: "DELETE"});
        } else if (b.dataset.a === "add"){ APPEND_PID = pr.id; $("#file").click(); return; }
        else if (b.dataset.a === "run") await api(`projects/${pr.id}/run`, {method: "POST"});
        else if (b.dataset.a === "label") await api(`projects/${pr.id}/label`, {method: "POST"});
        refreshList();
      }catch(e){ alert(e.message); }
    });
    el.appendChild(card);
  }
}

/* ---------------- upload + маппер ---------------- */
const DELIM_NAME = {";": "точка с запятой ( ; )", "\t": "табуляция", ",": "запятая ( , )", "|": "вертикальная черта ( | )"};
const VARIANTS = [
  ["openai",     "OpenAI 3-large",            "базовый · ~1 ₽/10К"],
  ["gemini",     "Gemini CLUSTERING",         "базовый · ~1 ₽/10К"],
  ["ensemble",   "Ансамбль OpenAI+Gemini",    "0 ₽ (из базовых)"],
  ["openai1536", "OpenAI 1536d",              "0 ₽ (обрезка)"],
  ["gemini768",  "Gemini 768d",               "0 ₽ (обрезка)"],
  ["gem_sim",    "Gemini SEMANTIC_SIMILARITY","~1 ₽/10К"],
  ["gem_query",  "Gemini RETRIEVAL_QUERY",    "~1 ₽/10К"],
  ["lemma",      "OpenAI по леммам",          "~1 ₽/10К"],
  ["intent",     "OpenAI интент-префикс",     "~2 ₽/10К"],
  ["voyage",     "Voyage 3-large",            "~1.5 ₽/10К"],
  ["qwen",       "Qwen3 text-embedding-v4",   "~0.7 ₽/10К"],
];
const COLS = [["query", "Запрос"], ["base", "Wordstat"], ["exact", "\"!Wordstat\""], ["vexact", "\"[!Wordstat]\""], ["topo", "Топоним"], ["ques", "Вопрос"]];

async function startUpload(f, appendPid){
  loading(true);
  try{
    const fd = new FormData();
    fd.append("file", f);
    const up = await api("uploads", {method: "POST", body: fd});
    openMapper(up, appendPid || null);
  }catch(e){ alert(e.message); }
  loading(false);
}

function openMapper(up, appendPid){
  const m = document.createElement("div");
  m.className = "modal";
  const sel = {delimiter: up.delimiter, has_header: up.has_header,
               query: up.query_col, base: up.base_col, exact: up.exact_col,
               vexact: up.vexact_col ?? -1, topo: up.topo_col ?? -1, ques: up.ques_col ?? -1};
  m.innerHTML = `<div class="mbox">
    <h2>${appendPid ? "Докинуть фразы в проект" : "Настрой файл под систему"}</h2>
    <div class="mrow">
      <div class="fld"><label>Название проекта</label><input id="mName" value="${esc(up.name)}"></div>
      <div class="fld"><label>Разделитель колонок</label><select id="mDelim">
        ${Object.keys(DELIM_NAME).map(d => `<option value="${d === "\t" ? "TAB" : d}" ${d === sel.delimiter ? "selected" : ""}>${DELIM_NAME[d]}</option>`).join("")}
      </select></div>
      <label class="chk"><input type="checkbox" id="mHdr" ${sel.has_header ? "checked" : ""}> первая строка — заголовки</label>
    </div>
    <div style="color:var(--muted); font-size:12.5px; margin-bottom:8px">
      Назначь колонки в шапке таблицы: <b style="color:var(--text)">Запрос</b> — обязательно.
      <b style="color:var(--text)">Wordstat</b> — базовая, <b style="color:var(--text)">"!Wordstat"</b> — точная,
      <b style="color:var(--text)">"[!Wordstat]"</b> — очень точная (фиксирует словоформы и порядок слов;
      если назначена — именно по ней считается трафик и сортировка кластеров).
      <b style="color:var(--text)">Топоним</b> и <b style="color:var(--text)">Вопрос</b> — флаги 0/1
      из Keys.so (по желанию; система и сама определяет города и вопросы).</div>
    <div class="ptable" id="mTable"></div>
    <div style="margin-bottom:14px">
      <label style="display:block; font-size:12px; color:var(--muted); margin-bottom:6px">ЭКСПЕРИМЕНТЫ (варианты эмбеддингов)</label>
      <label class="chk"><input type="radio" name="vmode" value="single"> один вариант:
        <select id="vSingle" style="width:auto; padding:5px 8px; font-size:13px">
          ${VARIANTS.map(([k, t]) => `<option value="${k}">${t}</option>`).join("")}
        </select></label>
      <label class="chk"><input type="radio" name="vmode" value="set" checked> A/B-набор:</label>
      <div id="vSet" style="display:flex; flex-wrap:wrap; gap:4px 18px; padding-left:24px">
        ${VARIANTS.map(([k, t, pr]) => `<label class="chk" style="padding:2px 0">
          <input type="checkbox" value="${k}" ${["openai", "gemini", "ensemble"].includes(k) ? "checked" : ""}>
          ${t} <span style="color:var(--muted); font-size:11.5px">${pr}</span></label>`).join("")}
      </div>
    </div>
    <div class="mfoot">
      <div class="err" id="mErr" style="flex:1; margin:0"></div>
      <button class="btn sec" id="mCancel">Отмена</button>
      <button class="btn" id="mGo">${appendPid ? "Добавить и пересчитать" : "Создать проект и запустить"}</button>
    </div>
  </div>`;
  document.body.appendChild(m);
  if (appendPid){
    m.querySelector("#mName").closest(".fld").style.display = "none";
    const vm = m.querySelector('input[name="vmode"]');
    if (vm) vm.closest("div").parentElement.style.display = "none";
  }
  const rows = () => up.previews[sel.delimiter] || [[]];

  function drawTable(){
    const rs = rows();
    const ncols = Math.max(...rs.map(r => r.length), 1);
    let html = "<table><tr>";
    for (let i = 0; i < ncols; i++){
      html += `<th><select data-col="${i}">
        <option value="">—</option>
        ${COLS.map(([k, t]) => `<option value="${k}" ${sel[k] === i ? "selected" : ""}>${t}</option>`).join("")}
      </select></th>`;
    }
    html += "</tr>";
    rs.forEach((r, ri) => {
      html += `<tr class="${ri === 0 && sel.has_header ? "hdr" : ""}">` +
        Array.from({length: ncols}, (_, i) => `<td>${esc(r[i] ?? "")}</td>`).join("") + "</tr>";
    });
    m.querySelector("#mTable").innerHTML = html + "</table>";
    m.querySelectorAll("#mTable select").forEach(s => s.onchange = () => {
      const col = +s.dataset.col, val = s.value;
      for (const [k] of COLS) if (sel[k] === col) sel[k] = -1;
      if (val) sel[val] = col;
      drawTable();
    });
  }
  drawTable();

  m.querySelector("#mDelim").onchange = e => {
    sel.delimiter = e.target.value === "TAB" ? "\t" : e.target.value;
    sel.query = 0; sel.base = -1; sel.exact = -1; sel.vexact = -1; sel.topo = -1; sel.ques = -1;
    drawTable();
  };
  m.querySelector("#mHdr").onchange = e => { sel.has_header = e.target.checked; drawTable(); };
  m.querySelector("#mCancel").onclick = () => m.remove();
  m.querySelector("#mGo").onclick = async () => {
    if (sel.query < 0){ m.querySelector("#mErr").textContent = "Укажи, в какой колонке запросы"; return; }
    loading(true);
    try{
      const mapping = {upload_id: up.upload_id,
          delimiter: sel.delimiter, has_header: sel.has_header,
          query_col: sel.query, base_col: sel.base, exact_col: sel.exact,
          vexact_col: sel.vexact, topo_col: sel.topo, ques_col: sel.ques};
      if (appendPid){
        const r = await api(`projects/${appendPid}/append`,
          {method: "POST", headers: {"Content-Type": "application/json"},
           body: JSON.stringify(mapping)});
        alert(`Добавлено новых фраз: ${r.added.toLocaleString("ru-RU")}, схлопнуто дублей: ${r.merged.toLocaleString("ru-RU")}. Итого в проекте: ${r.rows.toLocaleString("ru-RU")}. Пересчёт запущен.`);
      } else {
        const vmode = m.querySelector('input[name="vmode"]:checked').value;
        const variants = vmode === "single"
          ? [m.querySelector("#vSingle").value]
          : [...m.querySelectorAll("#vSet input:checked")].map(x => x.value);
        if (!variants.length){ m.querySelector("#mErr").textContent = "Выбери хотя бы один вариант эмбеддингов"; loading(false); return; }
        await api("projects", {method: "POST", headers: {"Content-Type": "application/json"},
          body: JSON.stringify({...mapping, name: m.querySelector("#mName").value, variants})});
      }
      m.remove();
      refreshList();
    }catch(e){ m.querySelector("#mErr").textContent = e.message; }
    loading(false);
  };
}

/* ---------------- boot ---------------- */
(async () => {
  try{ ME = await api("auth/me"); renderProjects(); }
  catch(e){ renderAuth(); }
})();
</script>
</body>
</html>
